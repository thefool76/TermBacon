name: Deploy TermBeacon to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: termbeacon-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve D1 database
        run: node scripts/prepare-cloudflare-resources.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate Cloudflare binding types
        run: npm run cf-typegen

      - name: Type-check
        id: typecheck
        run: npm run typecheck

      - name: Test contract extraction guards
        id: extraction_tests
        run: npm run test:extraction

      - name: Verify Next.js production build
        id: next_build
        run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}

      - name: Apply D1 migrations
        id: migrations
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test remote D1 auth session
        id: auth_smoke
        run: node scripts/smoke-auth-d1.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish pre-deploy verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          EXTRACTION_TESTS_OUTCOME: ${{ steps.extraction_tests.outcome }}
          BUILD_OUTCOME: ${{ steps.next_build.outcome }}
          MIGRATIONS_OUTCOME: ${{ steps.migrations.outcome }}
          SMOKE_OUTCOME: ${{ steps.auth_smoke.outcome }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          STATE="failure"
          CONTEXT="termbeacon/predeploy-incomplete"
          DESCRIPTION="Pre-deploy verification did not complete"
          if [ "$TYPECHECK_OUTCOME" != "success" ]; then
            CONTEXT="termbeacon/predeploy-typecheck"
            DESCRIPTION="Type-check failed before deployment"
          elif [ "$EXTRACTION_TESTS_OUTCOME" != "success" ]; then
            CONTEXT="termbeacon/predeploy-extraction-tests"
            DESCRIPTION="Contract extraction guard tests failed"
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            CONTEXT="termbeacon/predeploy-build"
            DESCRIPTION="Next.js production build failed before deployment"
          elif [ "$MIGRATIONS_OUTCOME" != "success" ]; then
            CONTEXT="termbeacon/predeploy-migrations"
            DESCRIPTION="D1 migrations failed before deployment"
          elif [ "$SMOKE_OUTCOME" != "success" ]; then
            CONTEXT="termbeacon/predeploy-auth-smoke"
            DESCRIPTION="Remote D1 auth session smoke test failed"
          else
            STATE="success"
            CONTEXT="termbeacon/predeploy-ok"
            DESCRIPTION="Typecheck, extraction tests, build, migrations and D1 auth smoke passed"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"$CONTEXT\",\"description\":\"$DESCRIPTION\"}"

      - name: Ensure Google OAuth secrets are configured
        id: oauth_secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "${GOOGLE_CLIENT_ID:-}" ] || [ -z "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "Google OAuth secrets are not configured in GitHub; preserving the Worker's current secret state."
            exit 0
          fi

          trap 'rm -f .existing-secrets.json .auth-secrets.json' EXIT

          npx wrangler secret list --format json > .existing-secrets.json

          if node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const entries = JSON.parse(readFileSync(".existing-secrets.json", "utf8"));
          const names = new Set(entries.map((entry) => entry.name));
          const configured = names.has("GOOGLE_CLIENT_ID") && names.has("GOOGLE_CLIENT_SECRET");
          console.log(configured
            ? "Google OAuth Worker secrets already exist; leaving them unchanged."
            : "One or more Google OAuth Worker secrets are missing; provisioning them now.");
          process.exit(configured ? 0 : 1);
          NODE
          then
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync(".auth-secrets.json", JSON.stringify({
            GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET,
          }));
          NODE

          npx wrangler secret bulk .auth-secrets.json

      - name: Deploy current code to Cloudflare
        id: worker_deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}

      - name: Verify active workers.dev Aura release
        id: production_smoke
        env:
          WORKER_URL: https://termbeacon.sumitmishra1135.workers.dev
          EXPECTED_RELEASE: ${{ github.sha }}
          EXPECTED_HERO: Vendor renewal control / 2026
        run: |
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              "${WORKER_URL}/?release=${EXPECTED_RELEASE}&attempt=${attempt}&ts=$(date +%s)" \
              -o "$BODY"; then
              HAS_RELEASE="no"
              HAS_AURA="no"

              if grep -Fq "data-release=\"${EXPECTED_RELEASE}\"" "$BODY"; then
                HAS_RELEASE="yes"
              fi

              if grep -Fq "$EXPECTED_HERO" "$BODY"; then
                HAS_AURA="yes"
              fi

              if [ "$HAS_RELEASE" = "yes" ] && [ "$HAS_AURA" = "yes" ]; then
                echo "Verified ${WORKER_URL} serves release ${EXPECTED_RELEASE} with the Aura landing hero."
                exit 0
              fi

              echo "Attempt ${attempt}/12: release=${HAS_RELEASE}, aura_hero=${HAS_AURA}."
            else
              echo "Attempt ${attempt}/12: homepage request failed."
            fi

            sleep 5
          done

          echo "::error::${WORKER_URL} did not serve release ${EXPECTED_RELEASE} with the Aura landing fingerprint."
          exit 1

      - name: Publish production deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SECRETS_OUTCOME: ${{ steps.oauth_secrets.outcome }}
          DEPLOY_OUTCOME: ${{ steps.worker_deploy.outcome }}
          PRODUCTION_SMOKE_OUTCOME: ${{ steps.production_smoke.outcome }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          STATE="failure"
          CONTEXT="termbeacon/deploy-incomplete"
          DESCRIPTION="Production deployment did not complete"
          if [ "$SECRETS_OUTCOME" != "success" ]; then
            CONTEXT="termbeacon/deploy-oauth-secrets"
            DESCRIPTION="OAuth secret verification/provisioning failed before code deployment"
          elif [ "$DEPLOY_OUTCOME" != "success" ]; then
            CONTEXT="termbeacon/deploy-worker"
            DESCRIPTION="Cloudflare Worker deployment failed"
          elif [ "$PRODUCTION_SMOKE_OUTCOME" != "success" ]; then
            CONTEXT="termbeacon/deploy-production-smoke"
            DESCRIPTION="workers.dev is not serving this Aura Git release"
          else
            STATE="success"
            CONTEXT="termbeacon/deploy-ok"
            DESCRIPTION="Worker serves this exact Git release with the Aura landing page"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"$CONTEXT\",\"description\":\"$DESCRIPTION\"}"
