name: Deploy TermBeacon to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: termbeacon-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve D1 database
        run: node scripts/prepare-cloudflare-resources.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate Cloudflare binding types
        run: npm run cf-typegen

      - name: Type-check
        id: typecheck
        run: npm run typecheck

      - name: Verify Next.js production build
        id: next_build
        run: npm run build

      - name: Apply D1 migrations
        id: migrations
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test remote D1 auth session
        id: auth_smoke
        run: node scripts/smoke-auth-d1.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish pre-deploy verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.next_build.outcome }}
          MIGRATIONS_OUTCOME: ${{ steps.migrations.outcome }}
          SMOKE_OUTCOME: ${{ steps.auth_smoke.outcome }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          STATE="failure"
          DESCRIPTION="Pre-deploy verification did not complete"
          if [ "$TYPECHECK_OUTCOME" != "success" ]; then
            DESCRIPTION="Type-check failed before deployment"
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            DESCRIPTION="Next.js production build failed before deployment"
          elif [ "$MIGRATIONS_OUTCOME" != "success" ]; then
            DESCRIPTION="D1 migrations failed before deployment"
          elif [ "$SMOKE_OUTCOME" != "success" ]; then
            DESCRIPTION="Remote D1 auth session smoke test failed"
          else
            STATE="success"
            DESCRIPTION="Typecheck, build, migrations and D1 auth smoke passed"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"termbeacon/predeploy\",\"description\":\"$DESCRIPTION\"}"

      - name: Deploy to Cloudflare
        id: worker_deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Sync Google OAuth secrets when configured
        id: oauth_secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "${GOOGLE_CLIENT_ID:-}" ] || [ -z "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "Google OAuth secrets are not configured in GitHub yet; auth stays in temporary-workspace mode."
            exit 0
          fi
          trap 'rm -f .auth-secrets.json' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync(".auth-secrets.json", JSON.stringify({
            GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET,
          }));
          NODE
          npx wrangler secret bulk .auth-secrets.json

      - name: Publish production deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.worker_deploy.outcome }}
          SECRETS_OUTCOME: ${{ steps.oauth_secrets.outcome }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          STATE="failure"
          DESCRIPTION="Production deployment did not complete"
          if [ "$DEPLOY_OUTCOME" != "success" ]; then
            DESCRIPTION="Cloudflare Worker deployment failed"
          elif [ "$SECRETS_OUTCOME" != "success" ]; then
            DESCRIPTION="Worker deployed but OAuth secret sync failed"
          else
            STATE="success"
            DESCRIPTION="Worker deployed and OAuth secrets synced"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"termbeacon/deploy\",\"description\":\"$DESCRIPTION\"}"
